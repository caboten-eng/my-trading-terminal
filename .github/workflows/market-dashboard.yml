name: US Market Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * 0-4'

permissions:
  contents: write

concurrency:
  group: market-dashboard-us
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance pandas numpy
      - name: Create US market dashboard data
        run: python market_dashboard.py
      - name: Commit result with retry
        shell: bash
        run: |
          set -euo pipefail
          cp results/market_dashboard.json /tmp/market_dashboard.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p results
            cp /tmp/market_dashboard.json results/market_dashboard.json
            git add results/market_dashboard.json
            if git diff --cached --quiet; then exit 0; fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update US market dashboard'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
