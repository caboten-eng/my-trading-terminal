
name: Stock Screener

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 1-5"

permissions:
  contents: write
jobs:
  screening:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run stock screener
        run: python screener.py

      - name: Upload screening results
        uses: actions/upload-artifact@v4
        with:
          name: screening-results
          path: |
            results/screening.csv
            results/screening.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit screening results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/screening.csv results/screening.json
          if ! git diff --cached --quiet; then
            git commit -m "Update screening results"
            git push
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update screening results"
            git push
          fi
          
      - name: Deploy results to public website
        env:
          GH_TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/caboten-eng/my-trading-terminal-web.git /tmp/trading-web

          mkdir -p /tmp/trading-web/results
          cp results/screening.json /tmp/trading-web/results/screening.json

          cd /tmp/trading-web

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/screening.json

          if ! git diff --cached --quiet; then
            git commit -m "Update screening data"
            git push
          fi
