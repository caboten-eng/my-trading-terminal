name: Japan Prime Stock Screener
on:
  workflow_dispatch:
  schedule:
    # 平日20:30日本時間（11:30 UTC）
    - cron: '30 11 * * 1-5'
permissions:
  contents: write
concurrency:
  group: japan-stock-screener
  cancel-in-progress: false
jobs:
  screening-jp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy openpyxl lxml html5lib beautifulsoup4
      - name: Run Japan Prime screener
        run: python screener_jp.py
      - name: Commit Japan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/screening_jp.json results/screening_jp.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Japan stock screening"
          git pull --rebase origin main
          git push origin HEAD:main
