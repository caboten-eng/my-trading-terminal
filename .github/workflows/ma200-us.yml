name: US MA200 Recovery Screener

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 2-6'

permissions:
  contents: write

concurrency:
  group: ma200-us-results
  cancel-in-progress: false

jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install yfinance pandas numpy openpyxl lxml html5lib

      - name: Run US MA200 screener
        run: python screener_ma200_us.py

      - name: Commit results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Update US MA200 screening results'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed, retrying ($attempt/5)"
            sleep 3
          done
          exit 1
