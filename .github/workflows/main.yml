name: Stock Screener

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stock-screener-results
  cancel-in-progress: false

jobs:
  screening:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas lxml

      - name: Run stock screener
        run: python screener.py

      - name: Upload screening results
        uses: actions/upload-artifact@v4
        with:
          name: screening-results
          path: |
            results/screening.csv
            results/screening.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit screening results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tmp=$(mktemp -d)
          cp results/screening.csv "$tmp/screening.csv"
          cp results/screening.json "$tmp/screening.json"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p results
            cp "$tmp/screening.csv" results/screening.csv
            cp "$tmp/screening.json" results/screening.json
            git add results/screening.csv results/screening.json

            if git diff --cached --quiet; then
              echo "Screening results are already up to date"
              exit 0
            fi

            git commit -m "Update screening results"
            if git push origin HEAD:main; then
              echo "Screening results pushed"
              exit 0
            fi

            echo "Push conflict; retrying ($attempt/5)"
            sleep 3
          done

          echo "Failed to push screening results after 5 attempts"
          exit 1

      - name: Deploy results to public website
        env:
          GH_TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/caboten-eng/my-trading-terminal-web.git /tmp/trading-web

          mkdir -p /tmp/trading-web/results
          cp results/screening.json /tmp/trading-web/results/screening.json

          cd /tmp/trading-web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/screening.json

          if ! git diff --cached --quiet; then
            git commit -m "Update screening data"
            git push
          fi
