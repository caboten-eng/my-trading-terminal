name: US Market Regime Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy lxml html5lib beautifulsoup4
      - name: Backtest US market regime
        run: python backtest_market.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-market-backtest
          path: results/market_backtest/
          if-no-files-found: warn
          retention-days: 30
